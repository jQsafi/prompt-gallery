name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # Crucial for pushing to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20 # Ensure Node.js version is compatible with Vite/dependencies

      - name: Install Dependencies
        run: npm install

      - name: Generate Prompt Index
        run: node scripts/generate-index.js
        working-directory: ./ # Run from root to find scripts/generate-index.js

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # The user's name and email for the deploy commit.
          # If not set, it uses "github-actions[bot]".
          # user_name: 'github-actions[bot]'
          # user_email: 'github-actions[bot]@users.noreply.github.com'
